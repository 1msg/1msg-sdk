# git-cliff config for the 1MSG SDK umbrella repo.
# Identical across release-deploy services. Renders from local git history only.
# Also drives `git cliff --bumped-version` for patch/minor/major suggestions.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} **[breaking]**{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Keep non-conventional commits; catch-all parser routes them to "Other".
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"

commit_preprocessors = [
  { pattern = '\s+', replace = " " },
]

# `bump` drives `git cliff --bumped-version` (see RELEASE-WORKFLOWS.md).
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps\\)", group = "Dependencies", bump = "patch" },
  { message = "^[Rr]elease ", skip = true },
  { message = "^feat", group = "Added", bump = "minor" },
  { message = "^fix", group = "Fixed", bump = "patch" },
  { message = "^perf", group = "Performance", bump = "patch" },
  { message = "^refactor", group = "Changed", bump = "patch" },
  { message = "^revert", group = "Reverted", bump = "patch" },
  { message = "^docs", group = "Documentation", bump = "none" },
  { message = "^test", group = "Testing", bump = "none" },
  { message = "^ci", group = "Build & CI", bump = "none" },
  { message = "^build", group = "Build & CI", bump = "none" },
  { message = "^chore", group = "Miscellaneous", bump = "none" },
  # Non-conventional commits: do not auto-bump (operator chooses patch if shipping).
  { message = ".*", group = "Other", bump = "none" },
]

filter_commits = false
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
