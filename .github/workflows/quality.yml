name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24.0.2'
      - run: npm ci
      - run: npm --prefix tools/quality ci
      - run: npm run test:preset
      - run: npm run quality:guards
      - run: npm run format:check
      - run: npm run lint:static
      - run: npm run lint:typed
      - run: npm run typecheck
      - run: npm run lint:arch
      - run: npm run lint:unused:production
      - run: npm run lint:unused:full
      - run: npm run lint:duplicates
      - run: npm run lint:duplicates:full
      - run: npm run lint:complexity
      - run: npm run test:exceptions
      - run: npm run test:generated
      - run: npm run test:quality
      - run: npm test
      - run: npm run build
      - run: npm run test:pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: quality/reports/
          if-no-files-found: error
  quality-required:
    if: always()
    needs: [checks]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs=JSON.parse(process.env.RESULTS); if(!Object.values(jobs).every(job=>job.result==="success")) process.exit(1)'
