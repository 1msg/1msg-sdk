name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: [self-hosted, 1msg-ci-heavy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24.0.2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir tools/quality --ignore-workspace install --lockfile-dir "$PWD/quality/tooling" --frozen-lockfile --ignore-scripts
      - run: pnpm run test:preset
      - run: pnpm run quality:guards
      - run: pnpm run format:check
      - run: pnpm run lint:static
      - run: pnpm run lint:typed
      - run: pnpm run typecheck
      - run: pnpm run lint:arch
      - run: pnpm run lint:unused:production
      - run: pnpm run lint:unused:full
      - run: pnpm run lint:duplicates
      - run: pnpm run lint:duplicates:full
      - run: pnpm run lint:complexity
      - run: pnpm run test:exceptions
      - run: pnpm run test:generated
      - run: pnpm run test:quality
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run test:pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: quality/reports/
          if-no-files-found: error
  quality-required:
    if: always()
    needs: [checks]
    runs-on: [self-hosted, 1msg-ci-heavy]
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const jobs=JSON.parse(process.env.RESULTS); if(!Object.values(jobs).every(job=>job.result==="success")) process.exit(1)'
