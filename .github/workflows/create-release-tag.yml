name: Create release tag

# Computes the next semver (patch/minor/major) from Conventional Commits,
# creates the git tag, publishes a GitHub Release, and updates CHANGELOG.md.
# Does not publish language packages to npm/PyPI/Maven/etc.
#
# Tagging with GITHUB_TOKEN does not trigger the separate Changelog workflow,
# so release notes + CHANGELOG.md are produced in this job.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = from commits since last tag)
        type: choice
        required: true
        default: auto
        options:
          - auto
          - major
          - minor
          - patch
      dry_run:
        description: Only print the suggested tag; do not create it
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: create-release-tag-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (full history + tags)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve current tag
        id: current
        run: |
          set -euo pipefail
          current="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 || true)"
          echo "tag=$current" >> "$GITHUB_OUTPUT"
          if [[ -z "$current" ]]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute auto bumped version
        if: inputs.bump == 'auto' && steps.current.outputs.empty != 'true'
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --bumped-version
        env:
          OUTPUT: BUMPED_VERSION.txt

      - name: Decide next tag
        id: next
        env:
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current="${{ steps.current.outputs.tag }}"

          bump_semver() {
            local ver="$1" kind="$2"
            local base="${ver#v}"
            base="${base%%-*}"
            IFS=. read -r maj min pat <<<"$base"
            case "$kind" in
              major) echo "v$((maj+1)).0.0" ;;
              minor) echo "v${maj}.$((min+1)).0" ;;
              patch) echo "v${maj}.${min}.$((pat+1))" ;;
              *) echo "unknown bump kind: $kind" >&2; exit 1 ;;
            esac
          }

          if [[ "${{ steps.current.outputs.empty }}" == "true" ]]; then
            suggested="v1.0.0"
            bump="initial"
          elif [[ "$BUMP_INPUT" != "auto" ]]; then
            suggested="$(bump_semver "$current" "$BUMP_INPUT")"
            bump="$BUMP_INPUT"
          else
            suggested=""
            if [[ -f BUMPED_VERSION.txt ]]; then
              suggested="$(tr -d '[:space:]' < BUMPED_VERSION.txt)"
            fi
            if [[ -n "$suggested" && "$suggested" != v* ]]; then
              suggested="v${suggested}"
            fi
            if [[ -z "$suggested" || "$suggested" == "$current" ]]; then
              echo "No release-worthy commits since ${current} (need feat/fix/perf/refactor/breaking)." >&2
              echo "Use bump=patch|minor|major to force, or wait for product commits." >&2
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "current=$current" >> "$GITHUB_OUTPUT"
              echo "suggested=$current" >> "$GITHUB_OUTPUT"
              echo "bump=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cur="${current#v}"; nxt="${suggested#v}"
            IFS=. read -r cmaj cmin _ <<<"${cur%%-*}"
            IFS=. read -r nmaj nmin _ <<<"${nxt%%-*}"
            bump="patch"
            if [[ "$nmaj" -gt "$cmaj" ]]; then bump="major"
            elif [[ "$nmin" -gt "$cmin" ]]; then bump="minor"
            fi
          fi

          if [[ ! "$suggested" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-final tag from automation: $suggested" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${suggested}" >/dev/null; then
            echo "Tag ${suggested} already exists." >&2
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "current=${current:-none}" >> "$GITHUB_OUTPUT"
          echo "suggested=$suggested" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "default_branch=${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"

      - name: Summary (always)
        if: always() && steps.next.outputs.suggested != ''
        run: |
          set -euo pipefail
          {
            echo "## Create release tag"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Current | \`${{ steps.next.outputs.current }}\` |"
            echo "| Next | \`${{ steps.next.outputs.suggested }}\` |"
            echo "| Bump | **${{ steps.next.outputs.bump }}** |"
            echo "| Dry run | \`${{ inputs.dry_run }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "current=${{ steps.next.outputs.current }} next=${{ steps.next.outputs.suggested }} bump=${{ steps.next.outputs.bump }}"

      - name: Stop on nothing to release
        if: steps.next.outputs.skip == 'true'
        run: |
          echo "Nothing to release (bump=none)."
          exit 0

      - name: Dry-run exit
        if: steps.next.outputs.skip != 'true' && inputs.dry_run
        run: |
          echo "Dry run only — would create ${{ steps.next.outputs.suggested }}"
          exit 0

      - name: Create and push tag
        if: steps.next.outputs.skip != 'true' && !inputs.dry_run
        env:
          TAG: ${{ steps.next.outputs.suggested }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "release: $TAG"
          git push origin "refs/tags/${TAG}"

      - name: Generate release notes
        if: steps.next.outputs.skip != 'true' && !inputs.dry_run
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --tag ${{ steps.next.outputs.suggested }} --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Ensure release notes file
        if: steps.next.outputs.skip != 'true' && !inputs.dry_run
        run: |
          set -euo pipefail
          if [[ ! -s RELEASE_NOTES.md ]]; then
            echo "_No changelog-relevant commits since previous tag._" > RELEASE_NOTES.md
          fi

      - name: Publish GitHub Release
        if: steps.next.outputs.skip != 'true' && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next.outputs.suggested }}
          name: ${{ steps.next.outputs.suggested }}
          body_path: RELEASE_NOTES.md
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout default branch for CHANGELOG.md
        if: steps.next.outputs.skip != 'true' && !inputs.dry_run
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.next.outputs.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CHANGELOG.md
        if: steps.next.outputs.skip != 'true' && !inputs.dry_run
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --tag ${{ steps.next.outputs.suggested }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit and push CHANGELOG.md
        if: steps.next.outputs.skip != 'true' && !inputs.dry_run
        env:
          TAG: ${{ steps.next.outputs.suggested }}
          BRANCH: ${{ steps.next.outputs.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "CHANGELOG.md unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore(release): update CHANGELOG.md for ${TAG} [skip ci]"
          git push origin "HEAD:${BRANCH}"
