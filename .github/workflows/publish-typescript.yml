name: Publish TypeScript SDK

# Publishes only the reviewed standalone TypeScript workspace. Other language
# trees stay frozen; this workflow never regenerates, syncs or commits sources.
# npm trust is bound to 1msg/1msg-sdk and this exact workflow filename.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full merged commit SHA whose TypeScript package will be published
        required: true
        type: string
      version:
        description: Exact existing package version (final semver; no version bump)
        required: true
        type: string
      dry_run:
        description: Validate and save the exact artifact without publishing to npm
        required: true
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: publish-typescript-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.repository == '1msg/1msg-sdk'
    name: Validate and pack reviewed @1msg/sdk
    runs-on: [self-hosted, 1msg-ci-heavy]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Require an immutable TypeScript source and explicit version
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_ref must be a full commit SHA' >&2; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'An explicit final semver is required' >&2; exit 1; }

      - name: Checkout reviewed public SDK source
        uses: actions/checkout@v4
        with:
          repository: 1msg/1msg-sdk
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify merged source and package identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          git merge-base --is-ancestor HEAD origin/main
          node <<'NODE'
          const assert = require('node:assert/strict');
          const root = require('./package.json');
          const pkg = require('./typescript/package.json');
          assert.equal(root.private, true);
          assert.equal(root.packageManager, 'pnpm@12.18.0');
          assert.deepEqual(root.workspaces, ['typescript']);
          assert.equal(pkg.name, '@1msg/sdk');
          assert.equal(pkg.version, process.env.RELEASE_VERSION);
          assert.notEqual(pkg.private, true);
          assert.equal(pkg.repository.url, 'git+https://github.com/1msg/1msg-sdk.git');
          assert.equal(pkg.repository.directory, 'typescript');
          assert.ok(pkg.publishConfig?.registry === undefined || /^https:\/\/registry\.npmjs\.org\/?$/.test(pkg.publishConfig.registry));
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          run_install: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24.0.2'

      - name: Run the standalone repository quality and consumer checks
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --dir tools/quality --ignore-workspace install --lockfile-dir "$PWD/quality/tooling" --frozen-lockfile --ignore-scripts
          for script in test:preset quality:guards format:check lint:static lint:typed typecheck lint:arch lint:unused:production lint:unused:full lint:duplicates lint:duplicates:full lint:complexity test:exceptions test:generated test:quality test build test:pack; do
            pnpm run "$script"
          done
          git diff --exit-code HEAD
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Pack the validated TypeScript workspace without regeneration
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk-release"
          npm pack --workspace=typescript --ignore-scripts --json --pack-destination "$RUNNER_TEMP/sdk-release" > "$RUNNER_TEMP/sdk-release/pack.json"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          const records = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'sdk-release/pack.json')));
          assert.equal(records.length, 1);
          const pkg = records[0];
          assert.equal(pkg.name, '@1msg/sdk');
          assert.equal(pkg.version, process.env.RELEASE_VERSION);
          assert.equal(pkg.filename, `1msg-sdk-${process.env.RELEASE_VERSION}.tgz`);
          assert.ok(pkg.files.some(file => file.path === 'dist/generated/src/runtime.js'));
          assert.ok(pkg.files.every(file => /^(dist\/|README\.md$|AGENTS\.md$|LICENSE$|package\.json$)/.test(file.path)));
          const archive = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'sdk-release', pkg.filename));
          assert.equal(pkg.integrity, `sha512-${createHash('sha512').update(archive).digest('base64')}`);
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'sdk-release/provenance.json'), JSON.stringify({ repository: '1msg/1msg-sdk', source: process.env.SOURCE_REF, version: pkg.version, integrity: pkg.integrity }, null, 2));
          NODE
          npm publish "$RUNNER_TEMP/sdk-release/1msg-sdk-${RELEASE_VERSION}.tgz" --ignore-scripts --access public --registry=https://registry.npmjs.org/ --dry-run

      - name: Preserve the exact reviewed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-sdk-${{ inputs.version }}-${{ inputs.source_ref }}
          path: ${{ runner.temp }}/sdk-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish validated tarball with npm trusted publishing
    needs: [prepare]
    if: ${{ !inputs.dry_run }}
    runs-on: [self-hosted, 1msg-ci-heavy]
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.1'
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
          dest: ${{ runner.temp }}/pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          run_install: false
      - name: Install the reviewed npm CLI with trusted publishing support
        run: npm install --global npm@11.19.1 --ignore-scripts --registry=https://registry.npmjs.org/
      - uses: actions/download-artifact@v4
        with:
          name: standalone-sdk-${{ inputs.version }}-${{ inputs.source_ref }}
          path: ${{ runner.temp }}/sdk-release/
      - name: Verify artifact identity and integrity before publication
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          assert.match(process.env.SOURCE_REF, /^[0-9a-f]{40}$/);
          assert.match(process.env.RELEASE_VERSION, /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/);
          const directory = path.join(process.env.RUNNER_TEMP, 'sdk-release');
          const manifest = JSON.parse(fs.readFileSync(path.join(directory, 'provenance.json')));
          assert.equal(manifest.repository, '1msg/1msg-sdk');
          assert.equal(manifest.source, process.env.SOURCE_REF);
          assert.equal(manifest.version, process.env.RELEASE_VERSION);
          const archive = fs.readFileSync(path.join(directory, `1msg-sdk-${manifest.version}.tgz`));
          assert.equal(manifest.integrity, `sha512-${createHash('sha512').update(archive).digest('base64')}`);
          NODE
      - name: Publish the exact validated tarball using GitHub OIDC
        run: |
          set -euo pipefail
          npm publish "$RUNNER_TEMP/sdk-release/1msg-sdk-${RELEASE_VERSION}.tgz" --ignore-scripts --access public --registry=https://registry.npmjs.org/ --tag latest
      - name: Verify published package integrity
        run: |
          set -euo pipefail
          expected="$(node -p 'require(process.env.RUNNER_TEMP + "/sdk-release/provenance.json").integrity')"
          for attempt in $(seq 1 30); do
            echo "Checking registry integrity (attempt ${attempt}/30)"
            actual="$(npm view "@1msg/sdk@${RELEASE_VERSION}" dist.integrity --registry=https://registry.npmjs.org/ --prefer-online 2>/dev/null || true)"
            if [[ "$actual" == "$expected" ]]; then
              echo "Verified published @1msg/sdk@${RELEASE_VERSION} from ${SOURCE_REF}"
              exit 0
            fi
            sleep 10
          done
          echo 'npm accepted publication, but registry integrity is still unverified after five minutes; inspect the existing version before any retry' >&2
          exit 1
