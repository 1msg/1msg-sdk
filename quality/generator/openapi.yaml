                messageId:
                  type: string
                msgId:
                  type: string
                typingIndicator:
                  type: boolean
                  default: false
                  description: Show WhatsApp typing indicator (max 25s or until reply)
          application/json:
            schema:
              type: object
              properties:
                messageId:
                  type: string
                msgId:
                  type: string
                typingIndicator:
                  type: boolean
                  default: false
                  description: Show WhatsApp typing indicator (max 25s or until reply)
      responses:
        "200":
          description: Server response example
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                additionalProperties: true
              example:
                result: success
        "401":
          description: Invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      tags:
        - Messaging
      operationId: createReadMessage
  /uploadMedia:
    post:
      summary: Upload media
      description: >
        Upload a file to WhatsApp media storage and get a numeric `mediaId`

        for later use with `send_file` / `send_sticker` (`mediaId` field, not
        `body`).


        Pass the file as `body` **or** `url` — an HTTP(S) URL or a base64 data
        URI.

        The `mediaId` in the response is a numeric string (keep it as a string).
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: File HTTP(S) URL or base64 data URI (`data:<mime>;base64,...`)
                url:
                  type: string
                  description: Alias for `body` — public HTTP(S) URL of the file to upload
            example:
              body: https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mediaId:
                    type: string
                additionalProperties: true
      tags:
        - Messaging
      operationId: createUploadMedia
