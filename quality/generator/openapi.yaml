  /whatsapp_business_encryption:
    get:
      summary: Get business encryption public key
      description: >
        Retrieve the WhatsApp business public key and signature status for this
        channel's

        phone number. Required before publishing or sending Flows that use data
        encryption.
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          description: Business encryption key status
          content:
            application/json:
              schema:
                type: object
                properties:
                  business_public_key:
                    type: string
                    description: Stored 2048-bit RSA public key (PEM)
                  business_public_key_signature_status:
                    type: string
                    enum:
                      - VALID
                      - MISMATCH
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: true
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Flows
      operationId: getWhatsappBusinessEncryption
    post:
      summary: Set business encryption public key
      description: >
        Upload and sign a 2048-bit RSA business public key (PEM) for this
        channel's phone number.

        Meta requires a signed key before Flow publish/send. Only one active key
        per number;

        a new upload replaces the previous key.
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - business_public_key
              properties:
                business_public_key:
                  type: string
                  description: 2048-bit RSA public key in PEM format
                  example: |
                    -----BEGIN PUBLIC KEY-----
                    MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...
                    -----END PUBLIC KEY-----
      responses:
        "200":
          description: Public key uploaded and signed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                additionalProperties: true
        "400":
          description: Missing or invalid PEM key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Flows
      operationId: setWhatsappBusinessEncryption
