openapi: 3.0.3
info:
  title: 1MSG WhatsApp Business API (Public)
  description: >
    Public client API for sending messages, managing groups, flows, and
    templates.


    This is the API exposed to end customers via platform.1msg.io


    **Authentication:** Pass the channel token in **one** place. The API checks

    JSON body (`token`), then query string (`?token=`), then

    `Authorization: Bearer` header (preferred in production).


    **Documentation:**
    https://help.1msg.io/platform-1msg/getting-start/quick-start

    **API Docs:** https://docs.1msg.io/
  version: 1.0.0
  contact:
    name: 1MSG API Support
    url: https://help.1msg.io
    email: support@1msg.io
servers:
  - url: https://api.1msg.io
    description: Production
  - url: https://api-stage.1msg.io
    description: Staging
  - url: http://127.0.0.1:3050
    description: Local development
tags:
  - name: Messaging
    description: Send messages, files, templates, and other content
  - name: Users
    description: Block, unblock, and list blocked WhatsApp users
  - name: Profile
    description: Channel profile information (read and update)
  - name: Channel
    description: Channel status and automation settings
  - name: Catalog
    description: Catalog and cart commerce settings (`GET`/`POST /commerce`)
  - name: Groups
    description: Create and manage WhatsApp groups
  - name: Flows
    description: WhatsApp Flows (interactive forms)
  - name: Templates
    description: Get and manage message templates
  - name: Webhooks
    description: >
      Client webhook URL configuration (`GET`/`POST /webhook`).


      Auto-disable is **per URL**, not per channel. Prefer `webhookStatuses` on

      `GET /webhook` / `GET /settings`. Top-level `haveDisabledWebhooks` means
      at

      least one configured URL is sticky-disabled; live URLs still receive
      events.
  - name: Calling
    description: >
      WhatsApp Calling API (beta) — VoIP **signaling** proxy.


      1msg does **not** host media, store call history, or store recordings.

      You need your own WebRTC or SIP stack.


      ### Prerequisites

      - Meta Calling enabled on the number (Cloud API; not COEX)

      - Paid channel — trial / `subscriptionBlocked` → **403** plain text

      - Webhook URL configured (`POST /webhook`) for `calls` events


      ### Inbound (user → business)

      1. Webhook `type=calls`, `event=connect` — take `call_id` + SDP **offer**

      2. Optional: `POST /initiateCall` `action=pre_accept` + WebRTC **answer**
      SDP

      3. `action=accept` + WebRTC **answer** SDP, or `action=reject`

      4. Later `event=terminate`, or `action=terminate` to hang up


      Answer within ~**30–60s** or Meta ends as unanswered.


      **Critical:** `accept` / `pre_accept` need a **WebRTC-generated SDP
      answer**.

      Do **not** echo Meta's offer. Postman/curl alone cannot establish real
      media.


      ### Outbound (business → user)

      1. Send Call Permission Request (CPR) — template or interactive

      2. Wait for permission reply on the **messages** webhook
      (`call_permission_reply`)

      3. `POST /initiateCall` `action=connect` + business SDP **offer**

      4. Apply Meta's SDP **answer** from the `calls` connect webhook


      Meta limits (summary): permission ~7 days; up to 5 calls / 24h / user;

      max 2 CPR / 7 days; auto-revoke after 4 unanswered.


      ### Webhooks (`type=calls`)

      Passthrough of Meta `field=calls` plus `type`, `instanceId`.

      Events: connect (offer or answer SDP), statuses (`RINGING` / `ACCEPTED` /

      `REJECTED`), terminate. CPR replies use the messages path, not
      `type=calls`.


      See operations below for request bodies and examples.
paths:
  /me:
    get:
      summary: Get Profile Info
      description: >
        Return the WhatsApp Business profile for this channel: About, address,

        description, email, phone, websites, industry (`vertical`), and profile
        photo URL.
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          description: Profile information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileInfo"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Profile
      operationId: getMe
    post:
      summary: Update profile info
      description: >
        Update WhatsApp Business Account profile fields. At least one of

        about, description, email, photo, address, vertical, websites is
        required.

        Blocked when the channel subscription limit is exceeded.
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                about:
                  type: string
                  description: Profile About section (WhatsApp status text)
                  example: Available 9–18
                address:
                  type: string
                  description: Business address shown on the profile
                description:
                  type: string
                  description: Business description (max 256 characters)
                email:
                  type: string
                  description: Business email shown on the profile
                  example: support@example.com
                vertical:
                  type: string
                  description: Industry of the business
                photo:
                  type: string
                  description: HTTPS URL or data:image/...;base64,... payload
                websites:
                  type: array
                  items:
                    type: string
                  description: Business website URLs
              additionalProperties: true
            example:
              about: Available 9–18
              email: support@example.com
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                additionalProperties: true
              example:
                result: success
        "401":
          $ref: "#/components/responses/InvalidToken"
        "422":
          description: Wrong request (no updatable fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Profile
      operationId: updateMe
  /sendMessage:
    post:
      summary: Send a Message
      description: >
        Send a message to an existing chat. (Only if the dialogue has an Open
        Session). 

        The message will be added to the queue for sending and delivered even if
        the phone 

        is disconnected from the Internet or authorization is not passed.


        Only one of two parameters is needed to determine the destination -
        chatId or phone.
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            example:
              body: Hello World
              phone: 12020721369
      responses:
        "200":
          $ref: "#/components/responses/MessageSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      operationId: sendMessage
  /sendFile:
    post:
      summary: Send a File
      description: >
        Send a file to an existing chat. (Only if the dialogue has an Open
        Session). 

        Only one of two parameters is needed to determine the destination -
        chatId or phone.
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/SendFileRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/SendFileRequest"
            example:
              phone: 12020721369
              body: https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf
              filename: dummy.pdf
              caption: Here is the file
      responses:
        "200":
          $ref: "#/components/responses/MessageSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      operationId: sendFile
  /sendLocation:
    post:
      summary: Send a Location
      description: >
        Send a location to an existing chat. (Only if the dialogue has an Open
        Session). 

        Only one of two parameters is needed to determine the destination -
        chatId or phone.
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - lat
                - lng
              properties:
                lat:
                  type: string
                  description: "Latitude of the location. Example: 45.018337"
                lng:
                  type: string
                  description: "Longitude of the location. Example: -73.968285"
                address:
                  type: string
                  description: "Address of the location. Only displayed if name is present.
                    Example: 9766 Valley View St., New York, NY 10024"
                name:
                  type: string
                  description: "Name of the location. Example: Facebook HQ"
                quotedMsgId:
                  type: string
                  description: Quoted message ID (Cloud API)
                chatId:
                  type: string
                  description: "Required if phone is not set. Chat ID from the message list.
                    Examples: 12020721369@c.us or
                    120363046942338209@g.us(group)"
                phone:
                  type: integer
                  description: "Required if chatId is not set. A phone number starting with the
                    country code. USA example: 12020721369."
          application/json:
            schema:
              type: object
              required:
                - lat
                - lng
              properties:
                lat:
                  type: string
                lng:
                  type: string
                address:
                  type: string
                name:
                  type: string
                quotedMsgId:
                  type: string
                chatId:
                  type: string
                phone:
                  type: integer
            example:
              lat: "45.018337"
              lng: "-73.968285"
              name: Facebook HQ
              address: 9766 Valley View St., New York, NY 10024
              phone: 12020721369
      responses:
        "200":
          $ref: "#/components/responses/MessageSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      operationId: sendLocation
  /sendContact:
    post:
      summary: Send a Contact
      description: >
        Send a WhatsApp contact card.


        Preferred simple body (legacy-compatible):


        ```json

        {
          "phone": "79001234567",
          "contact": { "name": "Lida", "phone": "+79181976551" }
        }

        ```


        Cloud API shape also works: `contacts` is an array of objects with

        `name.formatted_name` and `phones[].phone` (E.164 string, **not** a
        timestamp).
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          $ref: "#/components/responses/MessageSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: Recipient phone with country code. Use phone or chatId.
                chatId:
                  type: string
                  description: Recipient chat ID (`phone@c.us`, group `@g.us`, or BSUID `@lid`).
                    Use phone or chatId.
                quotedMsgId:
                  type: string
                contact:
                  type: object
                  description: Simple contact card. Use this or `contacts`.
                  required:
                    - name
                    - phone
                  properties:
                    name:
                      description: Display name (string) or Cloud API name object
                      oneOf:
                        - type: string
                        - type: object
                          additionalProperties: true
                    phone:
                      type: string
                      description: Contact phone in E.164 (`+79181976551`), not a timestamp
                    email:
                      type: string
                    org:
                      type: object
                      additionalProperties: true
                    url:
                      type: string
                contacts:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: object
                        properties:
                          formatted_name:
                            type: string
                          first_name:
                            type: string
                          last_name:
                            type: string
                          middle_name:
                            type: string
                          suffix:
                            type: string
                          prefix:
                            type: string
                      birthday:
                        type: string
                      addresses:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      emails:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      org:
                        type: object
                        properties:
                          company:
                            type: string
                          department:
                            type: string
                          title:
                            type: string
                      phones:
                        type: array
                        items:
                          type: object
                          properties:
                            phone:
                              type: string
                              description: E.164 phone (`+79181976551`). Not a timestamp.
                            type:
                              type: string
                            wa_id:
                              type: string
                      urls:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
            example:
              phone: "{{testPhone}}"
              contact:
                name: John Doe
                phone: "+1234567890"
      operationId: sendContact
  /sendList:
    post:
      summary: Send List Message
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          $ref: "#/components/responses/MessageSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: Recipient phone with country code. Use phone or chatId.
                chatId:
                  type: string
                  description: Recipient chat ID (`phone@c.us`, group `@g.us`, or BSUID `@lid`).
                    Use phone or chatId.
                quotedMsgId:
                  type: string
                body:
                  type: string
                buttonText:
                  type: string
                action:
                  type: string
                sections:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
                      rows:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: utc-millisec
                            title:
                              type: string
                            description:
                              type: string
            example:
              phone: "{{testPhone}}"
              body: This is a list message
              buttonText: Click me
              action: Action
              sections:
                - title: Section 1
                  rows:
                    - id: "1"
                      title: Row 1
                      description: Description for Row 1
      operationId: sendList
  /sendButton:
    post:
      summary: Send Reply Buttons Message
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          $ref: "#/components/responses/MessageSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: Recipient phone with country code. Use phone or chatId.
                chatId:
                  type: string
                  description: Recipient chat ID (`phone@c.us`, group `@g.us`, or BSUID `@lid`).
                    Use phone or chatId.
                quotedMsgId:
                  type: string
                  description: Optional Cloud API wamid to quote
                body:
                  type: string
                footer:
                  type: string
                header:
                  type: object
                  additionalProperties: true
                  description: Optional interactive header (text/image/video/document)
                buttons:
                  type: array
                  items:
                    type: object
                  description: Legacy alias for sections (`[{id,title}]`)
                sections:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      reply:
                        type: object
                        properties:
                          id:
                            type: string
                            format: utc-millisec
                          title:
                            type: string
            example:
              phone: "{{testPhone}}"
              body: This is a buttons message
              footer: Footer
              sections:
                - type: reply
                  reply:
                    id: "1"
                    title: Button 1
      operationId: sendButton
  /sendLocationRequest:
    post:
      summary: Send Location Request Message
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          $ref: "#/components/responses/MessageSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: Recipient phone with country code. Use phone or chatId.
                chatId:
                  type: string
                  description: Recipient chat ID (`phone@c.us`, group `@g.us`, or BSUID `@lid`).
                    Use phone or chatId.
                quotedMsgId:
                  type: string
                body:
                  type: string
            example:
              phone: "{{testPhone}}"
              body: Text
      operationId: sendLocationRequest
  /sendFlow:
    post:
      summary: Send WhatsApp Flow Message
      description: >
        Send Interactive WhatsApp Flow message to an existing chat. (Only if the
        dialogue has an Open Session). 

        Only one of two parameters is needed to determine the destination -
        chatId or phone.


        Use this method to send a published WhatsApp Flow as a service
        (interactive) message. 

        If the 24-hour window is closed, send a template with a FLOW button via
        /sendTemplate.
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - body
                - flowId
                - flowToken
                - flowCta
              properties:
                body:
                  type: string
                  description: Flow message body text
                header:
                  oneOf:
                    - type: string
                    - type: object
                  description: Flow header (string or text header object)
                footer:
                  type: string
                  description: Footer text
                flowId:
                  type: string
                  description: Published Flow ID
                flowToken:
                  type: string
                  description: Flow token generated by the business
                flowCta:
                  type: string
                  description: CTA button text
                flowAction:
                  type: string
                  enum:
                    - navigate
                    - data_exchange
                  description: Flow action type
                flowActionPayload:
                  type: object
                  description: Required for flowAction=navigate (screen is required). Ignored for
                    data_exchange. If data is provided, it must be a non-empty
                    object.
                flowMessageVersion:
                  type: string
                  description: Flow message version (default "3")
                mode:
                  type: string
                  enum:
                    - draft
                    - published
                  description: Flow mode (draft or published). If omitted, provider default
                    applies
                flowActionData:
                  type: object
                  description: Shortcut for flowActionPayload.data (optional)
                flowActionScreen:
                  type: string
                  description: Shortcut for flowActionPayload.screen (optional)
                quotedMsgId:
                  type: string
                  description: Quoted message ID (Cloud API)
                chatId:
                  type: string
                  description: "Required if phone is not set. Chat ID from the message list.
                    Examples: 12020721369@c.us or
                    120363046942338209@g.us(group)"
                phone:
                  type: integer
                  description: "Required if chatId is not set. A phone number starting with the
                    country code. USA example: 12020721369."
          application/json:
            schema:
              type: object
              required:
                - body
                - flowId
                - flowToken
                - flowCta
              properties:
                body:
                  type: string
                header:
                  oneOf:
                    - type: string
                    - type: object
                footer:
                  type: string
                flowId:
                  type: string
                flowToken:
                  type: string
                flowCta:
                  type: string
                flowAction:
                  type: string
                  enum:
                    - navigate
                    - data_exchange
                flowActionPayload:
                  type: object
                flowMessageVersion:
                  type: string
                mode:
                  type: string
                  enum:
                    - draft
                    - published
                flowActionData:
                  type: object
                flowActionScreen:
                  type: string
                quotedMsgId:
                  type: string
                chatId:
                  type: string
                phone:
                  type: integer
      responses:
        "200":
          $ref: "#/components/responses/MessageSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      operationId: sendFlow
  /sendReaction:
    post:
      summary: Send Reaction
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          $ref: "#/components/responses/MessageSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: Recipient phone with country code. Use phone or chatId.
                chatId:
                  type: string
                  description: Recipient chat ID (`phone@c.us`, group `@g.us`, or BSUID `@lid`).
                    Use phone or chatId.
                body:
                  type: string
                quotedMsgId:
                  type: string
            example:
              phone: "{{testPhone}}"
              body: 😀
              quotedMsgId: "{{lastMessageId}}"
      operationId: sendReaction
  /sendCarousel:
    post:
      summary: Send Carousel
      description: >
        You can send product cards via Carousel in two ways:


        Template messages: do not require a 24-hour customer service window
        between you and the recipient. Use sendTemplate.


        Free-form messages: can be sent only when a customer service window is
        open between you and the recipient. Use sendCarousel.


        The message structure in /sendCarousel is largely similar to sending a
        template. However, in this case you must 

        explicitly specify all elements that are created in advance when working
        with templates. This is because the message 

        is sent without using a template.


        In /sendCarousel, for a Catalog Carousel there can be either 1 URL
        button or one or more quick reply buttons.


        Prefer the simple `cards` array (2–10 cards). Each card needs a header
        media/product

        plus a CTA URL or quick-reply buttons. Example:


        ```json

        {
          "phone": "79001234567",
          "body": "Pick a product",
          "cards": [
            {
              "header": { "type": "image", "image": { "link": "https://example.com/1.jpg" } },
              "body": { "text": "Card one" },
              "type": "cta_url",
              "action": { "name": "cta_url", "parameters": { "url": "https://example.com/p1", "display_text": "Open" } }
            },
            {
              "header": { "type": "image", "image": { "link": "https://example.com/2.jpg" } },
              "body": { "text": "Card two" },
              "type": "cta_url",
              "action": { "name": "cta_url", "parameters": { "url": "https://example.com/p2", "display_text": "Open" } }
            }
          ]
        }

        ```


        `params` with a `CAROUSEL` component is the template-like alternative.
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: Text shown above the carousel. Optional. If omitted and params
                    include a body component, the body will be taken from
                    params.
                cards:
                  type: array
                  minItems: 2
                  maxItems: 10
                  description: Preferred. 2–10 carousel cards (header + body + CTA or quick
                    replies).
                  items:
                    type: object
                    additionalProperties: true
                params:
                  type: array
                  items:
                    type: object
                  description: >
                    Required. Template-like structure (same as sendTemplate
                    params). Must include a CAROUSEL component and its cards.


                    Structure:

                    - params[] item with type CAROUSEL and cards (2..10)

                    - cards[] item:
                      - components[] items:
                        - header: parameters[0] with type image/video/product
                          - image: {"image": {"link": "https://..."}}
                          - video: {"video": {"link": "https://..."}}
                          - product: {"product": {"catalog_id": "...", "product_retailer_id": "..."}}
                        - button: sub_type url or quick_reply
                          - url: parameters {"text": "Button", "url": "https://..."}
                          - quick_reply: parameters[] of {"id": "...", "text": "..."}
                quotedMsgId:
                  type: string
                  description: Quoted message ID (Cloud API)
                chatId:
                  type: string
                  description: "Required if phone is not set. Chat ID from the message list.
                    Examples: 12020721369@c.us or
                    120363046942338209@g.us(group)"
                phone:
                  type: integer
                  description: "Required if chatId is not set. A phone number starting with the
                    country code. USA example: 12020721369."
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: Text shown above the carousel
                cards:
                  type: array
                  minItems: 2
                  maxItems: 10
                  description: Preferred. 2–10 carousel cards.
                  items:
                    type: object
                    additionalProperties: true
                params:
                  type: array
                  items:
                    type: object
                  description: Template-like alternative — include a CAROUSEL component with cards
                quotedMsgId:
                  type: string
                chatId:
                  type: string
                phone:
                  type: integer
      responses:
        "200":
          $ref: "#/components/responses/MessageSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      operationId: sendCarousel
  /sendProduct:
    post:
      summary: Send a Product
      description: >
        Send a single catalog product or a product list.

        Destination is `chatId` or `phone`. `action` is required:

        - single product: `{ "catalog_id": "...", "product_retailer_id": "..."
        }`

        - product list: `{ "catalog_id": "...", "sections": [{ "title": "...",
        "product_items": [{ "product_retailer_id": "..." }] }] }`
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                phone:
                  type: string
                  description: Recipient phone with country code. Use phone or chatId.
                chatId:
                  type: string
                  description: Recipient chat ID (`phone@c.us`, group `@g.us`, or BSUID `@lid`).
                    Use phone or chatId.
                quotedMsgId:
                  type: string
                body:
                  type: string
                  description: Optional message text shown with the product
                footer:
                  type: string
                header:
                  type: string
                  description: Text header (product list only)
                action:
                  type: object
                  additionalProperties: true
                  description: Catalog action (`catalog_id` + `product_retailer_id`, or `sections`
                    for a list)
              additionalProperties: true
            example:
              chatId: 12020721369@c.us
              body: Have a look
              action:
                catalog_id: "448008021021719"
                product_retailer_id: "0001"
      responses:
        "200":
          $ref: "#/components/responses/MessageSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      operationId: sendProduct
  /sendTemplate:
    post:
      summary: Send Template Message
      description: >
        Send a WhatsApp **template** message (works outside the 24-hour session
        window).


        Use this tool — not `send_message` — when the 24h session is closed.


        `params` MUST be Cloud API **component objects**, never a flat list of
        strings

        and never the old On-Prem `hsm` / `localizable_params` format.


        Example body variable `{{1}}`:


        ```json

        {
          "type": "body",
          "parameters": [{ "type": "text", "text": "Ivan" }]
        }

        ```


        Do not send `"type": "hsm"` and do not send `params: ["Ivan", "123"]`.


        Supported `params` button `sub_type` values include: `url`,
        `quick_reply`,

        `copy_code` / `coupon_code`, `catalog`, `flow`, `limited_time_offer`,
        and

        **`order_details`** (WhatsApp Payments **India only** — requires an
        approved

        Utility template with an ORDER_DETAILS button).


        Convenience wrapper with structured fields: `POST /sendOrderDetails`.
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      tags:
        - Templates
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: string
                  description: Approved template name (template `name`, not the old HSM
                    `element_name`)
                language:
                  type: object
                  description: Template language. Always set `policy` to `deterministic`.
                  properties:
                    policy:
                      type: string
                      description: Must be `deterministic`
                      example: deterministic
                      default: deterministic
                    code:
                      type: string
                      example: en
                namespace:
                  type: string
                  description: Template namespace from `list_templates`
                params:
                  type: array
                  description: >
                    Template components in WhatsApp Cloud API format.

                    Each item is an object with `type` (`body`, `header`,
                    `button`)

                    and `parameters` (objects with `type` + `text` / media /
                    action).

                    Never a list of strings. Never HSM `localizable_params`.
                  items:
                    type: object
                    additionalProperties: true
                    description: |
                      Component object, e.g. {"type":"body","parameters":[{"type":"text","text":"Ivan"}]} or a header/button/carousel component. Not a string.
                phone:
                  type: string
                  description: Recipient phone with country code (use phone or chatId)
                chatId:
                  type: string
                  description: Recipient chat ID (`phone@c.us`, group `@g.us`, or BSUID `@lid`).
                    Use phone or chatId.
                quotedMsgId:
                  type: string
                  description: Optional Cloud API wamid to quote
                useMMlite:
                  type: boolean
                  description: >
                    Force Marketing Messages API (POST marketing_messages).

                    If omitted: auto for MARKETING category when channel has
                    mm_lite_enabled

                    and mm_lite_available service settings.
                messageActivitySharing:
                  type: boolean
                  description: >
                    Sets message_activity_sharing on WABA payload. Enables click
                    tracking webhooks.

                    Requires MM Lite path. Ignored on Cloud API fallback.
                messageSendTtlSeconds:
                  type: integer
                  description: >
                    Template message TTL in seconds (message_send_ttl_seconds).

                    MARKETING via MM Lite: 43200–2592000. AUTHENTICATION:
                    30–900.

                    UTILITY: 30–43200. AUTH/UTILITY also accept -1 (30-day
                    custom TTL).
            example:
              template: test_buttons_2
              language:
                policy: deterministic
                code: ru
              namespace: 41123797_e45e_4f06_a2fa_443b27c6f5ec
              phone: "{{testPhone}}"
              params:
                - type: body
                  parameters:
                    - type: text
                      text: Ivan
      operationId: sendTemplate
  /messages:
    get:
      summary: Get messages list
      description: |
        List stored chat history for this channel (requires history storage).
        Filter with `chatId`, `limit`, `last`, message numbers, or time bounds.
      parameters:
        - $ref: "#/components/parameters/token"
        - name: chatId
          in: query
          schema:
            type: string
          description: Filter messages for one chat (`phone@c.us`, group `@g.us`, or BSUID
            `@lid`)
        - name: limit
          in: query
          schema:
            type: integer
          description: Max rows to return (default 100)
        - name: last
          in: query
          schema:
            type: boolean
          description: If true, return the latest messages (DESC). Default false.
        - name: lastMessageNumber
          in: query
          schema:
            type: integer
        - name: firstMessageNumber
          in: query
          schema:
            type: integer
        - name: min_time
          in: query
          schema:
            type: integer
          description: Unix timestamp lower bound
        - name: max_time
          in: query
          schema:
            type: integer
          description: Unix timestamp upper bound
        - name: msgId
          in: query
          schema:
            type: string
          description: Filter by stored message id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  notice:
                    type: string
                  messages:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: true
              examples:
                ok:
                  value:
                    messages: []
                historyDisabled:
                  value:
                    notice: saving history disabled
      tags:
        - Messaging
      operationId: listMessages
  /readMessage:
    post:
      summary: Mark message as read
      parameters:
