  /status:
    get:
      summary: Get channel status
      description: >
        Return WhatsApp Cloud API connection status for this channel
        (`connected`

        when the number can send). May include `accountStatus`, messaging limit,

        and MM Lite availability.


        Optional `health_status_warning` appears only when Meta Graph health
        could

        not be loaded and a soft `connected` response is returned. Omitted on
        the

        normal path and when health details are not applicable for the channel —

        never an internal provider/transport name.
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          description: Channel status
          content:
            application/json:
              schema:
                type: object
                properties:
                  isCloud:
                    type: boolean
                    example: true
                  status:
                    type: string
                    description: typically `connected` when the number can send
                    example: connected
                  accountStatus:
                    type: string
                    example: authenticated
                  mm_lite_available:
                    type: boolean
                  health_status_warning:
                    type: string
                    description: Optional soft-fail warning when Meta Graph health_status could not
                      be loaded. Never includes internal provider names.
                additionalProperties: true
              example:
                isCloud: true
                status: connected
                accountStatus: authenticated
                mm_lite_available: false
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Channel
      operationId: getStatus
  /settings:
    get:
      summary: Get channel settings
      description: >
        Return channel settings: webhook URL(s), delivery flags, and analytics
        toggles.


        Auto-disable / circuit state matches `GET /webhook`. **Prefer
        `webhookStatuses`**

        (one row per configured URL). The breaker is per URL, not per channel.


        Channel-level `haveDisabledWebhooks` is `true` when **at least one** URL
        in

        `webhookUrl` is sticky auto-disabled — not "the channel is dead". Live
        URLs

        still receive events. Top-level `circuitState` / `reason` / `fails` /
        `trips`

        are a compatibility summary of one URL (first sticky-disabled, else
        first

        configured).


        This is the same `GET /settings` endpoint as the REST API (previously
        missing from MCP).
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhookUrl:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: One URL, or several if multiple webhooks are configured
                  guaranteedHooks:
                    type: boolean
                    description: Retry webhooks until acknowledged
                  ackNotificationsOn:
                    type: boolean
                    description: Include message ACK / status events in webhooks
                  rawHooks:
                    type: boolean
                    description: Forward raw provider webhook payloads
                  mm_lite_enabled:
                    type: boolean
                  template_analytics_enabled:
                    type: boolean
                  cta_url_link_tracking_opted_out:
                    type: boolean
                  haveDisabledWebhooks:
                    type: boolean
                    description: >
                      `true` when at least one URL in `webhookUrl` is sticky
                      auto-disabled.

                      Not "the channel is dead": other configured URLs still
                      receive events.
                  circuitState:
                    type: string
                    description: >
                      Compatibility scalar for **one** URL (first
                      sticky-disabled, else first

                      configured). Prefer `webhookStatuses[].circuitState`.
                    enum:
                      - ok
                      - degraded
                      - open
                      - half_open
                      - disabled
                  reason:
                    type: string
                    description: Last qualifying fail reason of the summary URL
                  fails:
                    type: integer
                    description: >
                      Diagnostic only (summary URL). Qualifying failures in the
                      rolling

                      ~10 minute breaker window — not lifetime. Prefer
                      `webhookStatuses`.
                  trips:
                    type: integer
                    description: >
                      Diagnostic only (summary URL). Failed recovery probes (≈15
                      min →

                      1 h → 6 h). Sticky disable after 3. Not a blind unblock
                      timer.
                  disabledAt:
                    type: integer
                    description: Epoch milliseconds when the summary URL became sticky-disabled
                  firstFailAt:
                    type: integer
                    description: >
                      Diagnostic only (summary URL). Epoch ms of the first fail
                      in the

                      current ~10 minute window (pairs with `fails`).
                  lastStatus:
                    type: integer
                    description: Last HTTP status from the summary URL, when known
                  nextProbeAt:
                    type: integer
                    description: Epoch milliseconds of the next half-open probe for the summary URL,
                      if any
                  disabledWebhooks:
                    type: array
                    description: Currently configured URLs that are sticky auto-disabled (subset of
                      `webhookUrl`)
                    items:
                      type: object
                      additionalProperties: true
                  webhookStatuses:
                    type: array
                    description: One entry per currently configured URL. Prefer this over top-level
                      `haveDisabledWebhooks` / `circuitState`.
                    items:
                      $ref: "#/components/schemas/WebhookUrlStatus"
                additionalProperties: true
              example:
                webhookUrl: https://example.com/webhook
                guaranteedHooks: false
                ackNotificationsOn: true
                rawHooks: false
                haveDisabledWebhooks: false
                circuitState: ok
                disabledWebhooks: []
                webhookStatuses:
                  - url: https://example.com/webhook
                    circuitState: ok
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Channel
      operationId: listSettings
    post:
      summary: Update channel settings
      description: >
        Update channel settings. Only send fields you want to change.


        `webhookUrl` **replaces** the stored list (one URL string, or up to 5
        URLs as an array).

        Passing an empty value clears webhooks. Repeating the same URL(s) also
        clears a

        sticky auto-disable. With several URLs, send the complete array to
        re-enable one

        of them — omitting a URL removes it from the channel.
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                webhookUrl:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: Replacement webhook URL, or array of URLs (max 5)
                guaranteedHooks:
                  type: boolean
                ackNotificationsOn:
                  type: boolean
                rawHooks:
                  type: boolean
                template_analytics_enabled:
                  type: boolean
                cta_url_link_tracking_opted_out:
                  type: boolean
              additionalProperties: true
            example:
              webhookUrl: https://example.com/webhook
              ackNotificationsOn: true
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Channel
      operationId: createSettings
  /commerce:
    get:
      summary: Get Commerce Settings
      description: >
        Returns catalog/cart commerce settings for the channel.


        Fails with a provider error when the WABA has no catalog linked — that
        is an

        API/account limitation, not an MCP schema bug.


        - `is_catalog_visible` — show catalog storefront icon (`true`) or hide
        it (`false`).

        - `is_cart_enabled` — enable cart (`true`) or disable it (`false`).
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          description: Commerce settings
