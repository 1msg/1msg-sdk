                      - SIGN_IN
                      - APPOINTMENT_BOOKING
                      - LEAD_GENERATION
                      - CONTACT_US
                      - CUSTOMER_SUPPORT
                      - SURVEY
                      - OTHER
                  description: One or more Flow categories
                endpointUri:
                  type: string
                  description: HTTPS endpoint for the Flow data channel
                publish:
                  type: boolean
                  description: Publish immediately after create
