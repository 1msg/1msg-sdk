  /conversationalAutomation:
    get:
      summary: Get conversational automation settings
      description: >
        Get WhatsApp conversational components for the channel (welcome message,

        ice-breaker prompts, and slash commands).


        Proxies Meta/360dialog `GET /conversational_automation`.


        When `enable_welcome_message` is true and a user opens chat for the
        first

        time, Meta delivers a webhook message with `type: request_welcome`. The

        inbound formatter exposes that as `type: "request_welcome"` and

        `meta.request_welcome: true` so your webhook can send a custom welcome
        reply.
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          description: Conversational automation settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationalAutomation"
              example:
                enable_welcome_message: true
                prompts:
                  - How can I help?
                commands:
                  - command_name: help
                    command_description: Get support options
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Channel
      operationId: getConversationalAutomation
    post:
      summary: Set conversational automation settings
      description: |
        Update WhatsApp conversational components.

        Allowed body fields (others are ignored):
        - `enable_welcome_message` (boolean)
        - `prompts` (string[], max 4, each ≤ 80 chars)
        - `commands` (`{ command_name, command_description }[]`)

        Proxies Meta/360dialog `POST /conversational_automation`.
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationalAutomation"
            example:
              enable_welcome_message: true
              prompts:
                - How can I help?
              commands:
                - command_name: help
                  command_description: Get support options
      responses:
        "200":
          description: >
            Updated settings from WABA, or legacy response.error wrapper on
            upstream failure.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Channel
      operationId: setConversationalAutomation
  /webhook:
    get:
      summary: Get webhook URL
      description: >
        Return the webhook URL(s) currently configured for this channel, plus
        delivery

        status for each URL.


        `webhookUrl` is a string when a single URL is set, an array of strings
        when

        multiple URLs are configured, or `null` if none is set.


        **Prefer `webhookStatuses`.** The circuit breaker is per URL, not per
        channel.

        If 1 of 4 URLs is sticky-disabled, that URL is skipped; the other three
        still

        receive events. Send/receive are not affected.


        Channel-level `haveDisabledWebhooks`, `circuitState`, `reason`, `fails`,

        `trips`, and timestamps are a compatibility summary of **one** URL (the
        first

        sticky-disabled URL, else the first configured URL). They are not "the
        channel

        is dead".


        - `haveDisabledWebhooks` — `true` when **at least one** URL in
        `webhookUrl` is
          sticky auto-disabled. Live URLs still get events.
        - `circuitState` — compressed scalar for that same primary URL:
          `ok` | `degraded` | `open` | `half_open` | `disabled`.
        - `disabledWebhooks` — currently configured URLs that are
        sticky-disabled
          (subset of `webhookUrl`).
        - `webhookStatuses` — one row per currently configured URL. Use this
        array
          to see which endpoints are live vs skipped.
        - `fails` / `trips` / `firstFailAt` — **diagnostics for support**, not
        product
          UI. `fails` = failures in a rolling ~10 minute window (not lifetime).
          `trips` = failed recovery probes on the 15 min → 1 h → 6 h schedule (sticky
          disable after 3). Clients can ignore these and use `webhookStatuses` +
          `disabledWebhooks` only.

        Sticky disable skips delivery; it does not unconfigure the URL (it stays
        in

        `webhookUrl`). Re-enable with `POST /webhook` or `POST /settings`. Those

        endpoints **replace** the whole list — with multiple URLs, send the full
        array.
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          description: Current webhook URL and per-URL circuit status
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhookUrl:
                    oneOf:
                      - type: string
                        format: uri
                      - type: array
                        items:
                          type: string
                          format: uri
                      - type: "null"
                    description: Configured webhook URL, array of URLs, or null when none is set
                  haveDisabledWebhooks:
                    type: boolean
                    description: >
                      `true` when at least one URL in `webhookUrl` is sticky
                      auto-disabled.

                      Not "the channel is dead": other configured URLs still
                      receive events.

                      Send/receive are unaffected.
                  circuitState:
                    type: string
                    description: >
                      Compatibility scalar for **one** URL (first
                      sticky-disabled, else first

                      configured). Not the channel as a whole. Prefer
                      `webhookStatuses[].circuitState`.
                    enum:
                      - ok
                      - degraded
                      - open
                      - half_open
                      - disabled
                  reason:
                    type: string
                    description: Last qualifying fail reason of the summary URL (same URL as
                      `circuitState`)
                  fails:
                    type: integer
                    description: >
                      Diagnostic only (summary URL). Qualifying failures in the
                      rolling

                      ~10 minute breaker window — not lifetime and not customer
                      retries.

                      Prefer `webhookStatuses` / `disabledWebhooks`.
                  trips:
                    type: integer
                    description: >
                      Diagnostic only (summary URL). Failed recovery probes (≈15
                      min →

                      1 h → 6 h). Sticky disable after 3. Not a blind unblock
                      timer.
                  disabledAt:
                    type: integer
                    description: Epoch milliseconds when the summary URL became sticky-disabled
                  firstFailAt:
                    type: integer
                    description: >
                      Diagnostic only (summary URL). Epoch ms of the first fail
                      in the

                      current ~10 minute window (pairs with `fails`).
                  lastStatus:
                    type: integer
                    description: Last HTTP status from the summary URL, when known
                  nextProbeAt:
                    type: integer
                    description: Epoch milliseconds of the next half-open probe for the summary URL,
                      if any
                  disabledWebhooks:
                    type: array
                    description: >
                      Currently configured URLs that are sticky auto-disabled
                      (subset of `webhookUrl`).

                      Does not include leftover URLs that are no longer
                      configured.
                    items:
                      type: object
                      additionalProperties: true
                  webhookStatuses:
                    type: array
                    description: >
                      One entry per currently configured URL. Prefer this over
                      top-level

                      `haveDisabledWebhooks` / `circuitState` when more than one
                      webhook is set.
                    items:
                      $ref: "#/components/schemas/WebhookUrlStatus"
                additionalProperties: true
              examples:
                healthy:
                  summary: Single URL delivering
                  value:
                    webhookUrl: https://example.com/webhook
                    haveDisabledWebhooks: false
                    circuitState: ok
                    disabledWebhooks: []
                    webhookStatuses:
                      - url: https://example.com/webhook
                        circuitState: ok
                mixed:
                  summary: One of several URLs sticky-disabled
                  value:
                    webhookUrl:
                      - https://live.example.com/webhook
                      - https://down.example.com/webhook
                    haveDisabledWebhooks: true
                    circuitState: disabled
                    reason: http_404
                    fails: 1
                    trips: 3
                    disabledWebhooks:
                      - url: https://down.example.com/webhook
                        reason: http_404
                        state: disabled
                        fails: 1
                        trips: 3
                    webhookStatuses:
                      - url: https://live.example.com/webhook
                        circuitState: ok
                      - url: https://down.example.com/webhook
                        circuitState: disabled
                        reason: http_404
                        fails: 1
                        trips: 3
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Webhooks
      operationId: getWebhook
    post:
      summary: Set webhook URL
      description: >
        Set the client webhook URL that receives inbound events for this
        channel.


        **Replaces** the stored webhook list (it does not append). To deliver
        the same

        events to several endpoints, pass an array in `webhookUrl` (max 5) or
        use

        `POST /settings`. With several URLs already configured, posting only the

        disabled URL **drops the others** — send the complete array to re-enable
        one

        of many.


        Incoming payloads include messages, delivery ACKs, group updates,
        coexistence

        echoes, and calling events. WhatsApp Calling payloads (`type: "calls"`)
        are

        documented under the **Calling** tag. Call permission replies arrive on
        the

        normal messages path (`call_permission_reply`).


        Repeating `POST /webhook` with the same URL(s) clears an auto-disable
        (self-serve

        re-enable). Send/receive are not affected by webhook auto-disable.
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - webhookUrl
              properties:
                webhookUrl:
                  oneOf:
                    - type: string
                      format: uri
                    - type: array
                      items:
                        type: string
                        format: uri
                      maxItems: 5
                  description: >
                    HTTP or HTTPS URL, or array of URLs (max 5). Replaces the
                    stored list.

                    Empty values are rejected — clear webhooks with `POST
                    /settings`.
              additionalProperties: true
            examples:
              single:
                summary: Single URL
                value:
                  webhookUrl: https://example.com/webhook
              multiple:
                summary: Several URLs (replaces the list)
                value:
                  webhookUrl:
                    - https://example.com/webhook
                    - https://backup.example.com/webhook
      responses:
        "200":
          description: Webhook configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  set:
                    type: boolean
                    description: True when the stored webhook URL(s) match the request
                  webhookUrl:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                    description: Currently stored webhook URL or list
                additionalProperties: true
              example:
                set: true
                webhookUrl: https://example.com/webhook
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Webhooks
      operationId: setWebhook
  /callingSettings:
    get:
      summary: Get calling settings
      description: >
        Return WhatsApp Calling API settings for this channel (beta).


        Proxies upstream `GET /calling/settings`.


        **Prerequisites**

        - Number must be eligible for Meta Calling (Cloud API; not COEX)

        - Trial / `subscriptionBlocked` channels receive **403** plain text

        - You need your own WebRTC or SIP stack; 1msg is a **signaling proxy**
        only
          and does **not** store call history or recordings

        See the **Calling** tag overview for inbound/outbound flows and
        webhooks.
      parameters:
        - $ref: "#/components/parameters/token"
      responses:
        "200":
          description: Calling settings (and possibly other Cloud API settings Meta returns)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallingSettings"
              example:
                calling:
                  status: ENABLED
                  call_icon_visibility: DEFAULT
                  callback_permission_status: ENABLED
                  sip:
                    status: DISABLED
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Calling
      operationId: getCallingSettings
    post:
      summary: Update calling settings
      description: >
        Enable, disable, or update WhatsApp Calling settings (beta).


        Proxies upstream `POST /calling/settings`.

        Body is forwarded as-is (1msg does not validate fields).


        **Common fields under `calling`**

        - `status` (`ENABLED` | `DISABLED`) — required to turn calling on/off

        - `call_icon_visibility` (`DEFAULT` | `DISABLE_ALL`) — optional

        - `callback_permission_status` (`ENABLED` | `DISABLED`) — optional;
          when enabled, inbound user calls grant callback permission
        - `call_hours` — optional hours / timezone object

        - `sip` — optional SIP trunk; when SIP is ENABLED, Graph call actions
        and
          calling webhooks are not used
        - `srtp_key_exchange_protocol` (`DTLS` | `SDES`) — SDES only with SIP

        - `video.status` — optional


        Meta may accept only one feature group per request — prefer focused
        updates

        (e.g. enable status first, then SIP).


        Trial / `subscriptionBlocked` → **403** plain text.
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallingSettings"
            examples:
              enable:
                summary: Enable calling
                value:
                  calling:
                    status: ENABLED
                    call_icon_visibility: DEFAULT
                    callback_permission_status: ENABLED
              disable:
                summary: Disable calling
                value:
                  calling:
                    status: DISABLED
              enableSip:
                summary: Enable SIP (disables Graph call webhooks)
                value:
                  calling:
                    status: ENABLED
                    sip:
                      status: ENABLED
                      servers:
                        - hostname: sip.example.com
                          port: 5061
      responses:
        "200":
          description: |
            Usually `{ "success": true }` from upstream, or legacy
            `{ "result": "success" }` / `{ "response": { "error": "..." } }`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  result:
                    type: string
                    example: success
                  response:
                    type: object
                    properties:
                      error:
                        type: string
                    additionalProperties: true
                additionalProperties: true
              example:
                success: true
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Calling
      operationId: updateCallingSettings
  /initiateCall:
    post:
      summary: Call action (connect / pre_accept / accept / reject / terminate)
      description: >
        Perform a WhatsApp Calling action (beta).


        Proxies upstream `POST /calling/calls`. Despite the historical path

        name `/initiateCall`, this endpoint handles **all** call actions:


        | action | Use | Required |

        |--------|-----|----------|

        | `connect` | Outbound business → user | `to` + `session` (`sdp_type:
        offer`) |

        | `pre_accept` | Inbound (optional, reduces audio clipping) | `call_id`
        + `session` (`sdp_type: answer`) |

        | `accept` | Inbound answer | `call_id` + `session` (`sdp_type: answer`)
        |

        | `reject` | Decline inbound | `call_id` |

        | `terminate` | Hang up | `call_id` |


        **SDP / media (critical)**

        - `accept` / `pre_accept` require a **WebRTC-generated SDP answer**.

        - Do **not** send Meta's offer SDP back as the answer.

        - Postman (or curl) alone **cannot** establish real media — you need a
          WebRTC or SIP stack. 1msg only proxies signaling.

        Answer within ~**30–60 seconds** of an inbound `connect` webhook or Meta

        terminates as unanswered. Common Meta errors include Calling not enabled

        (`138000`), no permission (`138006`), SDP validation failures.


        **Outbound** requires a prior Call Permission Request (CPR) acceptance.

        See the **Calling** tag overview for the full outbound flow and CPR
        limits.


        Trial / `subscriptionBlocked` → **403** plain text.

        Upstream failures often return HTTP 200 with `{ "response": { "error":
        "<upstream message>" } }`.

        `Invalid API KEY` is used only when Meta/360 body actually indicates an

        invalid API key or token. Other upstream 401s (notably call permission

        `138006`) pass through `error.message` / `error_user_msg`.
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiateCallRequest"
            examples:
              outboundConnect:
                summary: Outbound connect (business SDP offer)
                value:
                  messaging_product: whatsapp
                  to: "12185552828"
                  action: connect
                  biz_opaque_callback_data: order-123
                  session:
                    sdp_type: offer
                    sdp: "[REPLACE_WITH_WEBRTC_SDP]"
              preAccept:
                summary: Inbound pre_accept (WebRTC answer SDP)
                value:
                  messaging_product: whatsapp
                  call_id: wacid.ABGGFjFVU2AfAgo6V-Hc5eCgK5Gh
                  action: pre_accept
                  session:
                    sdp_type: answer
                    sdp: "[REPLACE_WITH_WEBRTC_SDP]"
              accept:
                summary: Inbound accept (WebRTC answer SDP)
                value:
                  messaging_product: whatsapp
                  call_id: wacid.ABGGFjFVU2AfAgo6V-Hc5eCgK5Gh
                  action: accept
                  session:
                    sdp_type: answer
                    sdp: "[REPLACE_WITH_WEBRTC_SDP]"
              reject:
                summary: Reject inbound call
                value:
                  messaging_product: whatsapp
                  call_id: wacid.ABGGFjFVU2AfAgo6V-Hc5eCgK5Gh
                  action: reject
              terminate:
                summary: Terminate active call
                value:
                  messaging_product: whatsapp
                  call_id: wacid.ABGGFjFVU2AfAgo6V-Hc5eCgK5Gh
                  action: terminate
      responses:
        "200":
          description: Call action result from upstream, or legacy error wrapper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiateCallResponse"
              examples:
                success:
                  summary: Accept / pre_accept / reject / terminate success
                  value:
                    messaging_product: whatsapp
                    success: true
                connectSuccess:
                  summary: Outbound connect success (includes call id)
                  value:
                    messaging_product: whatsapp
                    calls:
                      - id: wacid.HBgLMTIxODU1NTI4MjgVAgARGCAyODRQIAFRoA
                upstreamError:
                  summary: Upstream error wrapped by 1msg
                  value:
                    response:
                      error: Calling not enabled
                callPermissionDenied:
                  summary: Meta 138006 (upstream 401, not Invalid API KEY)
                  value:
                    response:
                      error: No approved call permission from the recipient
                invalidApiKey:
                  summary: Real invalid D360/Meta token
                  value:
                    response:
                      error: Invalid API KEY
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Calling
      operationId: initiateCall
