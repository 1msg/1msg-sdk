      operationId: removeTemplate
components:
  parameters:
    flowId:
      name: flowId
      in: path
      required: true
      schema:
        type: string
      description: Flow ID
    token:
      name: token
      in: query
      required: true
      schema:
        type: string
      description: JWT token or API key for authorization
    date:
      name: date
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Filter by date (YYYY-MM-DD)
    groupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
      description: Group ID (phone number with country code)
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
      description: Standard error response
    MessageSentResponse:
      type: object
      properties:
        sent:
          type: boolean
          description: Whether the message was successfully queued for sending
        id:
          type: string
          description: Message ID
        message:
          type: string
          description: Status message
        description:
          type: string
          description: Detailed description
      additionalProperties: true
      description: Response for successfully sent message
    SuccessResponse:
      type: object
      properties:
        result:
          type: string
          description: Operation result
      additionalProperties: true
      description: Generic success response
    ProfileInfo:
      type: object
      properties:
        about:
          type: string
          description: Profile's About section
        address:
          type: string
          description: Address of the business
        description:
          type: string
          description: Description of the business
        email:
          type: string
          description: Business email
        phone:
          type: string
          description: Linked phone number
        vertical:
          type: string
          enum:
            - Automotive
            - Beauty, Spa and Salon
            - Clothing and Apparel
            - Education
            - Entertainment
            - Event Planning and Service
            - Finance and Banking
            - Food and Grocery
            - Public Service
            - Hotel and Lodging
            - Medical and Health
            - Non-profit
            - Professional Services
            - Shopping and Retail
            - Travel and Transportation
            - Restaurant
            - Other
          description: Industry of the business
        photo:
          type: string
          description: Profile photo URL
        websites:
          type: array
          items:
            type: string
      additionalProperties: true
      description: WhatsApp Business profile information
    ConversationalAutomation:
      type: object
      properties:
        enable_welcome_message:
          type: boolean
          description: Enable the automatic welcome message for new conversations
        prompts:
          type: array
          maxItems: 4
          description: Ice-breaker prompt strings (max 4, each ≤ 80 characters)
          items:
            type: string
            maxLength: 80
        commands:
          type: array
          maxItems: 30
          description: Slash commands shown in WhatsApp
          items:
            type: object
            required:
              - command_name
              - command_description
            properties:
              command_name:
                type: string
                maxLength: 32
              command_description:
                type: string
                maxLength: 256
            additionalProperties: true
      additionalProperties: true
    CallingSettings:
      type: object
      description: >
        Calling settings payload for GET/POST `/callingSettings`.

        Proxies upstream `GET|POST /calling/settings`.

        Extra Meta fields may appear on GET responses; document core fields
        below.
      properties:
        calling:
          type: object
          description: Calling feature configuration for the business phone number
          properties:
            status:
              type: string
              description: Enable or disable Calling API on this number
              enum:
                - ENABLED
                - DISABLED
              example: ENABLED
            call_icon_visibility:
              type: string
              description: Controls call icon visibility in the WhatsApp client
              enum:
                - DEFAULT
                - DISABLE_ALL
              example: DEFAULT
            callback_permission_status:
              type: string
              description: >
                When ENABLED, a user who calls your business automatically
                grants

                call permission for business-initiated callbacks (subject to
                Meta rules).
              enum:
                - ENABLED
                - DISABLED
              example: ENABLED
            srtp_key_exchange_protocol:
              type: string
              description: |
                SRTP key exchange. DTLS is default/recommended.
                SDES is only valid when SIP signaling is enabled.
              enum:
                - DTLS
                - SDES
              example: DTLS
            call_hours:
              type: object
              description: Optional call hours / timezone configuration (Meta shape)
              additionalProperties: true
              properties:
                status:
                  type: string
                  example: ENABLED
                timezone:
                  type: string
                  example: America/Los_Angeles
                day_of_week_start:
                  type: string
                  example: MONDAY
            sip:
              type: object
              description: >
                SIP trunk settings. When SIP is ENABLED, Graph call actions and

                calling webhooks are not used — Meta dials your SIP server
                directly.
              properties:
                status:
                  type: string
                  enum:
                    - ENABLED
                    - DISABLED
                  example: DISABLED
                servers:
                  type: array
                  items:
                    type: object
                    properties:
                      hostname:
                        type: string
                        example: sip.example.com
                      port:
                        type: integer
                        example: 5061
                      request_uri_user_params:
                        type: object
                        additionalProperties:
                          type: string
                      sip_user_password:
                        type: string
                        description: Present on GET when SIP credentials are returned by Meta
                      password:
                        type: string
                        description: Alternate password field name from some Meta responses
                      app_id:
                        type: string
                    additionalProperties: true
              additionalProperties: true
            video:
              type: object
              description: Video calling toggle when supported
              properties:
                status:
                  type: string
                  enum:
                    - ENABLED
                    - DISABLED
              additionalProperties: true
            audio:
              type: object
              description: Audio settings (typically response-only)
              properties:
                status:
                  type: string
              additionalProperties: true
            restrictions:
              type: object
              description: Calling restrictions (response-only)
              additionalProperties: true
            ip_addresses:
              type: object
              description: Meta media IP ranges (response-only)
              additionalProperties: true
            call_icons:
              type: object
              description: Call icon country restrictions (response-only)
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
    InitiateCallRequest:
      type: object
      description: >
        Call action payload for `POST /initiateCall` (proxies upstream `POST
        /calling/calls`).


        Despite the path name, this endpoint handles **all** call actions — not
        only

        outbound connect.


        ## Required fields by `action`


        | action | Required | `session` |

        |--------|----------|-----------|

        | `connect` (outbound) | `messaging_product`, `to`, `action` |
        `sdp_type: offer` + business WebRTC SDP |

        | `pre_accept` | `messaging_product`, `call_id`, `action` | `sdp_type:
        answer` (WebRTC-generated) |

        | `accept` | `messaging_product`, `call_id`, `action` | `sdp_type:
        answer` (WebRTC-generated) |

        | `reject` | `messaging_product`, `call_id`, `action` | none |

        | `terminate` | `messaging_product`, `call_id`, `action` | none |


        **Critical:** For `pre_accept` / `accept`, `session.sdp` must be a

        **WebRTC-generated SDP answer**. Do not echo Meta's offer SDP back.

        Postman alone cannot establish real media — you need a WebRTC (or SIP)
        stack.
      required:
        - messaging_product
        - action
      properties:
        messaging_product:
          type: string
          description: Must be `whatsapp`
          enum:
            - whatsapp
          example: whatsapp
        action:
          type: string
          description: Call control action
          enum:
            - connect
            - pre_accept
            - accept
            - reject
            - terminate
          example: connect
        call_id:
          type: string
          description: >
            WhatsApp call id from the inbound/outbound calls webhook
            (`calls[].id`).

            Required for `pre_accept`, `accept`, `reject`, `terminate`.
          example: wacid.ABGGFjFVU2AfAgo6V-Hc5eCgK5Gh
        to:
          type: string
          description: |
            Recipient WhatsApp user phone (digits, country code, no +).
            Required for outbound `connect`.
          example: "12185552828"
        biz_opaque_callback_data:
          type: string
          description: Optional opaque string echoed on later call webhooks for correlation
          maxLength: 512
          example: order-123-callback
        session:
          type: object
          description: WebRTC SDP session (required for connect / pre_accept / accept)
          required:
            - sdp_type
            - sdp
          properties:
            sdp_type:
              type: string
              description: offer for outbound connect; answer for pre_accept/accept
              enum:
                - offer
                - answer
              example: offer
            sdp:
              type: string
              description: >
                Full SDP (RFC 8866). Replace placeholders with SDP from your
                WebRTC stack.

                Must negotiate ICE, DTLS-SRTP, and OPUS for WhatsApp media.
              example: "[REPLACE_WITH_WEBRTC_SDP]"
          additionalProperties: true
      additionalProperties: true
    InitiateCallResponse:
      type: object
      description: >
        Successful call action response from upstream, returned as-is.

        On empty upstream body, 1msg may return `{ "result": "success" }`.

        Upstream failures are often wrapped as HTTP 200 `{ "response": {
        "error": "..." } }`.
      properties:
        messaging_product:
          type: string
          example: whatsapp
        success:
          type: boolean
          example: true
        calls:
          type: array
          description: Present on outbound `connect` — contains the new call id
          items:
            type: object
            properties:
              id:
                type: string
                example: wacid.HBgLMTIxODU1NTI4MjgVAgARGCAyODRQIAFRoA
            additionalProperties: true
        result:
          type: string
          description: Legacy success marker when upstream returns an empty body
          example: success
        response:
          type: object
          description: Present when 1msg wraps an upstream error
          properties:
            error:
              type: string
          additionalProperties: true
      additionalProperties: true
    WebhookUrlStatus:
      type: object
      description: |
        Circuit / auto-disable status for one configured webhook URL.
        The breaker is per URL (`instanceId` + URL hash), not per channel.
      required:
        - url
        - circuitState
      properties:
        url:
          type: string
          format: uri
          description: This webhook URL (same string as in `webhookUrl`)
        circuitState:
          type: string
          description: >
            Delivery state for this URL only. `ok` delivering; `degraded` recent
            qualifying fails (still delivering, warning email on the 2nd fail);
            `open` skipping most deliveries pending a probe; `half_open` probe
            in flight (resume only on HTTP 2xx); `disabled` sticky auto-disabled
            until self-serve re-enable (`POST /webhook` / `POST /settings` with
            this URL) or a successful probe before sticky disable.
          enum:
            - ok
            - degraded
            - open
            - half_open
            - disabled
        reason:
          type: string
          description: Last qualifying fail reason, e.g. `http_404` or `timeout_or_network`
        fails:
          type: integer
          description: >
            Diagnostic only — safe for clients to ignore. Number of qualifying
            delivery

            failures in the rolling ~10 minute breaker window (not lifetime, not
            "how many

            times the customer retried"). Prefer `circuitState` /
            `disabledWebhooks`.
        trips:
          type: integer
          description: >
            Diagnostic only — safe for clients to ignore. How many recovery
            probes already

            failed for this URL. Probes run on a schedule (≈15 min → 1 h → 6 h);
            sticky

            disable after 3 failed probes. The 6 h step is the last probe, not a
            blind

            "unblock in 6 hours" timer.
        disabledAt:
          type: integer
          description: Epoch milliseconds when this URL became sticky-disabled
        firstFailAt:
          type: integer
          description: >
            Diagnostic only. Epoch ms of the first fail in the current ~10
            minute window

            (pairs with `fails`; not a customer-facing period).
        lastStatus:
          type: integer
          description: Last HTTP status from this URL, when known
        nextProbeAt:
          type: integer
          description: Epoch milliseconds of the next half-open probe, if any
      additionalProperties: true
    SendMessageRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
          description: Message text, UTF-8 or UTF-16 string with emoji
          minLength: 1
          maxLength: 4096
          example: Hello World 🌍
        quotedMsgId:
          type: string
          description: Message ID to quote/reply to (Cloud API wamid)
          pattern: ^wamid\..+$
          example: wamid.HBgNMTIwMjA3MjEzNjkVAgARGBI5RTBCNUY0QUE2RjZBQzhGNDkA
        chatId:
          type: string
          description: "Recipient chat ID: phone@c.us, group@g.us, or BSUID@lid"
          example: 12020721369@c.us
        phone:
          type: integer
          description: Phone number starting with country code (alternative to chatId)
          minimum: 1000000000
          maximum: 999999999999999
          example: 12020721369
      additionalProperties: false
      description: Request body for sending a text message
    SendFileRequest:
      type: object
      properties:
        body:
          type: string
          description: |
            File source (required unless mediaId is set):
            - HTTP/HTTPS URL
            - Base64 data URI
        filename:
          type: string
          description: File name with extension (required with body, not with mediaId)
        mediaId:
          type: string
          description: WABA media id from uploadMedia (alternative to body)
        mediaType:
          type: string
          enum:
            - image
            - video
            - audio
            - document
          description: Required when using mediaId
        voice:
          type: boolean
          description: Native WhatsApp voice note (audio/ogg only)
        caption:
          type: string
          maxLength: 1024
        quotedMsgId:
          type: string
        chatId:
          type: string
        phone:
          type: integer
      additionalProperties: true
      description: Send file by URL/base64 or by mediaId
  responses:
    InvalidToken:
      description: Invalid or missing authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MessageSent:
      description: Message sent successfully
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageSentResponse"
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Success:
      description: Operation successful
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessResponse"
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: query
      name: token
      description: JWT token or API key
  requestBodies: {}
security:
  - tokenAuth: []
