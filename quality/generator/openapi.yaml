        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      operationId: deleteMedia
  /deleteMedia:
    post:
      summary: Delete media from WABA storage (deprecated alias)
      deprecated: true
      description: >
        **Deprecated.** Use `DELETE /media/{mediaId}` instead.


        This POST alias is kept for backward compatibility with earlier
        integrations.

        New integrations should call `DELETE /media/{mediaId}`: 1msg follows
        REST

        conventions for resource deletion going forward (delete a resource with
        the

        `DELETE` verb on its resource path).
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mediaId
              properties:
                mediaId:
                  type: string
                  description: Numeric WABA media id
              additionalProperties: true
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      operationId: deleteMediaLegacy
