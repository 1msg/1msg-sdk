                - id: "789887292550821"
                  is_cart_enabled: true
                  is_catalog_visible: true
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Catalog
      operationId: getCommerce
    post:
      summary: Set Commerce Settings
      description: >
        Update catalog/cart commerce settings via the `params` object.


        - `params.is_catalog_visible` — show catalog storefront icon (`true`) or
        hide it (`false`).

        - `params.is_cart_enabled` — enable cart (`true`) or disable it
        (`false`).


        Blocked when the channel subscription limit is exceeded.

        Requires a commerce-capable channel (Cloud Functions `/commerceWAV2`).
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
