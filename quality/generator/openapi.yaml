  /sendAddressMessage:
    post:
      summary: Send address request message
      description: >
        Request shipping address from the user (WhatsApp interactive
        `address_message`).


        **India and Singapore only.** Requires:

        - Business WhatsApp number registered in that country

        - Recipient phone matching the country (`+91` ↔ `IN`, `+65` ↔ `SG`)


        Pass `country: "IN"` or `country: "SG"`. Eligibility is validated
        upstream;

        mismatches (e.g. Singapore phone with `country: "IN"`) return errors
        such as

        `Unsupported Interactive Message type` (HTTP 200 with `sent: false`).


        Optional action parameters: `values`, `saved_addresses`,
        `validation_errors`.
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                phone:
                  type: integer
                  description: Recipient phone (E.164 digits, no +). Must match country.
                chatId:
                  type: string
                body:
                  type: string
                  description: Body text shown with the address request
                country:
                  type: string
                  enum:
                    - IN
                    - SG
                  description: Address form country. Defaults to IN if omitted.
                  example: SG
                values:
                  type: object
                  description: Optional prefilled address fields
                  additionalProperties: true
                saved_addresses:
                  type: array
                  description: Optional previously saved addresses for the user
                  items:
                    type: object
                    additionalProperties: true
                validation_errors:
                  type: object
                  description: Optional field validation errors when re-prompting
                  additionalProperties: true
                quotedMsgId:
                  type: string
              additionalProperties: true
            examples:
              singapore:
                summary: Singapore
                value:
                  phone: 6531650115
                  body: Thanks for your order! Tell us what address you’d like this delivered to.
                  country: SG
              india:
                summary: India
                value:
                  phone: 919876543210
                  body: Thanks for your order! Tell us what address you’d like this delivered to.
                  country: IN
      responses:
        "200":
          $ref: "#/components/responses/MessageSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      operationId: sendAddressMessage
  /sendOrderDetails:
    post:
      summary: Send order details (India payments template)
      description: >
        Send a WhatsApp **order details** payment / invoice message using a

        pre-approved **Utility** template that has an `ORDER_DETAILS` button.


        **India only** (WhatsApp Payments India). Requires:

        - India WhatsApp Business number

        - Commerce enabled on the channel (`GET`/`POST /commerce`)

        - Approved template with an `ORDER_DETAILS` button


        Use this method when you need structured fields (`order`, `referenceId`,

        `currency`, `paymentSettings`). The API appends a template button

        `sub_type: order_details` and sends via the same path as `POST
        /sendTemplate`.


        Works **outside the 24-hour session window** (template message).


        You can also send the same payload yourself with `POST /sendTemplate` by

        including a button component in `params`:


        ```json

        {
          "type": "button",
          "sub_type": "order_details",
          "index": 0,
          "parameters": [{
            "type": "action",
            "action": {
              "order_details": {
                "reference_id": "order-123",
                "currency": "INR",
                "order": { "status": "pending", "items": [], "subtotal": { "offset": 100, "value": 50000 } }
              }
            }
          }]
        }

        ```
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - template
                - namespace
                - language
                - order
              properties:
                phone:
                  type: integer
                  description: Recipient phone (India E.164 digits, no +). Use phone or chatId.
                  example: 919876543210
                chatId:
                  type: string
                  description: Recipient chatId (e.g. phone@c.us). Use phone or chatId.
                template:
                  type: string
                  description: Approved Utility template name that includes an ORDER_DETAILS
                    button
                  example: order_details_utility
                namespace:
                  type: string
                  description: Template namespace from the channel / template list
                  example: your_namespace_uuid
                language:
                  type: object
                  description: Template language
                  required:
                    - code
                  properties:
                    code:
                      type: string
                      description: Language code
                      example: en
                    policy:
                      type: string
                      description: Optional language policy
                      example: deterministic
                  additionalProperties: true
                params:
                  type: array
                  description: >
                    Extra template components (HEADER / BODY / etc.). If an
                    order_details button is missing, the API appends one from
                    order / referenceId / currency / paymentSettings.
                  items:
                    type: object
                    additionalProperties: true
                referenceId:
                  type: string
                  description: Unique order / payment reference id (maps to reference_id)
                  example: order-123
                currency:
                  type: string
                  description: Currency code for India payments
                  example: INR
                paymentSettings:
                  type: object
                  description: >
                    Optional payment settings (UPI / payment gateway / payment
                    link). Forwarded as payment_settings on the order_details
                    action.
                  additionalProperties: true
                order:
                  type: object
                  description: >
                    Order payload for the ORDER_DETAILS button. Typical fields:
                    status, items[], subtotal, tax, shipping, discount. Amount
                    objects use `{ "offset": 100, "value": <minor_units> }`
                    (e.g. value 50000 with offset 100 = ₹500.00).
                  required:
                    - items
                  properties:
                    status:
                      type: string
                      description: Order status
                      example: pending
                    items:
                      type: array
                      description: Line items
                      items:
                        type: object
                        properties:
                          retailer_id:
                            type: string
                            example: SKU-1
                          name:
                            type: string
                            example: Item
                          quantity:
                            type: integer
                            example: 1
                          amount:
                            type: object
                            properties:
                              offset:
                                type: integer
                                example: 100
                              value:
                                type: integer
                                example: 50000
                            additionalProperties: true
                        additionalProperties: true
                    subtotal:
                      type: object
                      properties:
                        offset:
                          type: integer
                          example: 100
                        value:
                          type: integer
                          example: 50000
                      additionalProperties: true
                    tax:
                      type: object
                      additionalProperties: true
                    shipping:
                      type: object
                      additionalProperties: true
                    discount:
                      type: object
                      additionalProperties: true
                  additionalProperties: true
              additionalProperties: true
            example:
              phone: 919876543210
              template: order_details_utility
              namespace: your_namespace_uuid
              language:
                code: en
              referenceId: order-123
              currency: INR
              order:
                status: pending
                items:
                  - retailer_id: SKU-1
                    name: Item
                    amount:
                      offset: 100
                      value: 50000
                    quantity: 1
                subtotal:
                  offset: 100
                  value: 50000
      responses:
        "200":
          $ref: "#/components/responses/MessageSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      operationId: sendOrderDetails
  /sendPaymentRequest:
    post:
      summary: Send payment request (regional)
      description: >
        Send a regional payment request interactive message (beta scaffold).

        `region` must be IN, SG, or BR. Payload shape follows Meta regional
        payments docs;

        verify on stage before production use. Full regional builders are not
        implemented yet.
      parameters:
        - $ref: "#/components/parameters/token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - region
              properties:
                phone:
                  type: integer
                region:
                  type: string
                  enum:
                    - IN
                    - SG
                    - BR
                body:
                  type: string
                interactive:
                  type: object
                  additionalProperties: true
                action:
                  type: object
                  additionalProperties: true
              additionalProperties: true
      responses:
        "200":
          $ref: "#/components/responses/MessageSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidToken"
        "500":
          $ref: "#/components/responses/InternalError"
      tags:
        - Messaging
      operationId: sendPaymentRequest
  /retrieveMedia:
    get:
      summary: Retrieve uploaded media metadata
      description: |
